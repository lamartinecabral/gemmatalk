<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d1d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>GemmaTalk · Private AI chat</title>
    <script type="importmap">
      {
        "imports": {
          "@litert-lm/core": "https://cdn.jsdelivr.net/npm/@litert-lm/core@0.15.0/+esm"
        }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { ink: "#080d1d", panel: "#10172b", line: "#26304a", electric: "#8b7cff" },
            boxShadow: { glow: "0 0 0 1px rgba(139,124,255,.2), 0 24px 70px rgba(0,0,0,.3)" }
          }
        }
      };
    </script>
    <style>
      * { scrollbar-width: thin; scrollbar-color: #37415d transparent; }
      body { background: #080d1d; }
      #messages { scrollbar-gutter: stable; }
      .message a { color: #a9a0ff; }
      .message .content { white-space: pre-wrap; overflow-wrap: anywhere; }
      @keyframes pulse-dot { 50% { opacity: .35; transform: scale(.8); } }
      .thinking-dot { animation: pulse-dot 1.2s ease-in-out infinite; }
      .thinking-dot:nth-child(2) { animation-delay: .15s; }
      .thinking-dot:nth-child(3) { animation-delay: .3s; }
      @keyframes generation-spin { to { transform: rotate(360deg); } }
      .generation-spinner { width: .7rem; height: .7rem; border: 2px solid rgba(139,124,255,.25); border-top-color: #a9a0ff; border-radius: 999px; animation: generation-spin .8s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .generation-spinner { animation-duration: 1.8s; } }
    </style>
  </head>
  <body class="max-h-dvh font-mono text-slate-100 antialiased selection:bg-electric/30">
    <main class="mx-auto flex max-h-dvh w-full max-w-5xl flex-col px-4 py-6 sm:px-8 sm:py-10">
      <section class="flex min-h-[calc(100dvh-3rem)] flex-1 flex-col overflow-hidden rounded-3xl border border-line bg-panel/90 shadow-glow backdrop-blur sm:min-h-[calc(100vh-5rem)]">
        <div class="flex items-center justify-between border-b border-line px-5 py-4 sm:px-7">
          <div>
            <div class="flex items-center gap-2">
              <h2 class="font-semibold tracking-tight">Chat with Gemma</h2>
              <span class="rounded-full border border-amber-300/30 bg-amber-400/10 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-widest text-amber-200" title="GemmaTalk is currently in beta" aria-label="Beta version">Beta</span>
            </div>
            <p class="mt-0.5 text-xs text-slate-400">Gemma 4 E2B · runs locally · no data leaves this device</p>
          </div>
          <div class="flex items-center gap-3 text-xs text-slate-500">
            <span class="hidden sm:inline">1.9 GB model</span>
            <span class="h-1 w-1 rounded-full bg-slate-600"></span>
            <span>Local</span>
            <button id="clearBtn" type="button" disabled aria-label="Clear conversation history" title="Clear conversation history" class="group flex h-8 items-center gap-1.5 rounded-lg border border-line px-2.5 text-slate-400 transition hover:border-red-400/50 hover:bg-red-500/10 hover:text-red-300 active:scale-95 disabled:cursor-not-allowed disabled:opacity-40">
              <i data-lucide="trash-2" aria-hidden="true" class="h-3.5 w-3.5"></i><span class="hidden sm:inline">Clear</span>
            </button>
          </div>
        </div>

        <div id="progress-container" class="hidden border-b border-line bg-indigo-500/[.06] px-5 py-3 sm:px-7">
          <div class="mb-2 flex justify-between text-xs text-slate-400">
            <span id="progress-label" class="flex items-center gap-2"><span class="h-1.5 w-1.5 animate-pulse rounded-full bg-indigo-400"></span> Downloading model for offline use…</span>
            <span id="progress-text" class="font-mono text-indigo-300">0%</span>
          </div>
          <div class="h-1.5 overflow-hidden rounded-full bg-slate-800"><div id="progress-bar" class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-400 transition-[width] duration-200" style="width: 0%"></div></div>
        </div>

        <div id="messages" aria-live="polite" class="flex-1 space-y-5 overflow-y-auto px-5 py-6 sm:px-7 sm:py-8"></div>

        <template id="welcome-template">
          <div id="welcome" class="flex h-full min-h-64 flex-col items-center justify-center text-center">
            <div class="mb-4 grid h-14 w-14 place-items-center rounded-2xl border border-indigo-400/20 bg-indigo-500/10 text-indigo-300">
              <i data-lucide="message-circle" aria-hidden="true" class="h-7 w-7"></i>
            </div>
            <h3 class="text-base font-medium">Your private conversation starts here</h3>
            <p class="mt-2 max-w-sm text-sm leading-6 text-slate-400">Ask anything. The model is downloaded once and then runs entirely on your device.</p>
          </div>
        </template>

        <template id="you-message-template">
          <div class="message ml-auto flex max-w-[88%] flex-col gap-1.5 rounded-2xl bg-indigo-500 px-4 py-3 text-sm leading-6 text-white shadow-sm">
            <div class="message-header flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wider text-indigo-100">
              <span class="message-icon grid h-5 w-5 place-items-center rounded-md bg-white/15">
                <i data-lucide="user-round" class="h-3 w-3" aria-hidden="true"></i>
              </span>
              <span class="sender">You</span>
            </div>
            <span class="content"></span>
          </div>
        </template>

        <template id="system-message-template">
          <div class="message mx-auto max-w-xl py-2 text-center text-xs italic text-slate-500"></div>
        </template>

        <template id="ai-message-template">
          <div class="message mr-auto flex max-w-[88%] flex-col gap-1.5 rounded-2xl border border-line bg-slate-900/80 px-4 py-3 text-sm leading-6 text-slate-200 shadow-sm">
            <div class="message-header flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wider text-indigo-300">
              <span class="message-icon grid h-5 w-5 place-items-center rounded-md bg-indigo-500/15">
                <i data-lucide="sparkles" class="h-3 w-3" aria-hidden="true"></i>
              </span>
              <span class="sender">AI</span>
            </div>
            <span class="content"></span>
            <span class="generation-indicator mt-1 inline-flex items-center gap-2 text-[10px] font-normal tracking-normal text-indigo-300" role="status" aria-live="polite">
              <span class="generation-spinner" aria-hidden="true"></span>
              <span class="generation-status">Thinking…</span>
            </span>
            <span class="generation-speed hidden text-[10px] font-normal tracking-normal text-slate-500"></span>
          </div>
        </template>

        <div class="border-t border-line bg-slate-950/20 p-4 sm:p-5">
          <div class="flex items-center gap-3 rounded-2xl border border-line bg-slate-900/80 p-2 transition focus-within:border-indigo-400/60 focus-within:ring-4 focus-within:ring-indigo-500/10">
            <textarea id="userInput" rows="1" placeholder="Message Gemma…" disabled autocomplete="off" aria-label="Message Gemma" class="min-h-10 max-h-40 min-w-0 flex-1 resize-none overflow-y-auto bg-transparent px-3 py-2.5 text-sm leading-5 text-slate-100 outline-none placeholder:text-slate-500 disabled:cursor-not-allowed"></textarea>
            <button id="sendBtn" disabled aria-label="Send message" class="group flex h-10 shrink-0 items-center gap-2 rounded-xl bg-indigo-500 px-4 text-sm font-semibold text-white shadow-lg shadow-indigo-950/30 transition hover:bg-indigo-400 active:scale-95 disabled:cursor-not-allowed disabled:bg-slate-700 disabled:text-slate-500 disabled:shadow-none">
              <span>Send</span><i data-lucide="send" aria-hidden="true" class="h-4 w-4 transition-transform group-hover:translate-x-0.5"></i>
            </button>
          </div>
          <p class="mt-2 px-2 text-[11px] text-slate-500">Press <kbd class="rounded border border-line px-1 py-0.5 text-slate-400">Enter</kbd> to send · <kbd class="rounded border border-line px-1 py-0.5 text-slate-400">Shift</kbd> + <kbd class="rounded border border-line px-1 py-0.5 text-slate-400">Enter</kbd> for a new line · Your messages stay on this device</p>
        </div>
      </section>
    </main>
    <script type="module" src="./app/index.js"></script>
  </body>
</html>
